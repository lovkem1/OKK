name: Build OKK Custom (微信 8.0.79)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: okk-custom-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 37 & build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Locate and rename APK
        run: |
          set -e
          APK=$(find app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: no APK produced"; exit 1
          fi
          mkdir -p artifacts
          cp "$APK" "artifacts/OKK-custom-8.0.79-debug.apk"
          ls -lh artifacts/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKK-custom-8.0.79-debug
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Build summary
        run: |
          echo "## ✅ 云编译成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 提交: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- 产物: OKK-custom-8.0.79-debug.apk（在 Artifacts 中下载）" >> $GITHUB_STEP_SUMMARY
          echo "- 签名: Android 默认 debug 签名（定制版已放行自定义签名）" >> $GITHUB_STEP_SUMMARY
