name: Build OKK Custom (微信 8.0.79)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: okk-custom-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform 37 & build-tools
        run: |
          # API 37 平台在 sdkmanager 默认通道不可见，官方提供的是 android-37.2 extension 包。
          # 直接下载 Google 官方 zip 并解压为 platforms/android-37，AGP compileSdk=37 即可识别。
          set -e
          cd "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          # 平台 android-37.2（api-level 37, extension 2）→ 解压后 android-37 目录
          curl -fsSL -o /tmp/platform37.zip "https://dl.google.com/android/repository/platform-37.2_r02.zip"
          mkdir -p platforms/android-37
          unzip -q -o /tmp/platform37.zip -d platforms/android-37
          # 包内是 android-15 之类根目录，需把内容上提到 android-37
          SUBDIR=$(find platforms/android-37 -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -n "$SUBDIR" ] && [ "$(basename "$SUBDIR")" != "android-37" ]; then
            cp -a "$SUBDIR"/. platforms/android-37/
            rm -rf "$SUBDIR"
          fi
          # build-tools 37.0.0 走 sdkmanager（默认通道可见）
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;37.0.0"
          echo "=== installed platform files ==="
          ls platforms/android-37 | head
          test -f platforms/android-37/android.jar && echo "android.jar OK"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew || true

      - name: Setup Gradle 9.6.1 (wrapper jar 缺失，直接用发行版)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Locate and rename APK
        run: |
          set -e
          APK=$(find app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: no APK produced"; exit 1
          fi
          mkdir -p artifacts
          cp "$APK" "artifacts/OKK-custom-8.0.79-debug.apk"
          ls -lh artifacts/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKK-custom-8.0.79-debug
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Build summary
        run: |
          echo "## ✅ 云编译成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 提交: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- 产物: OKK-custom-8.0.79-debug.apk（在 Artifacts 中下载）" >> $GITHUB_STEP_SUMMARY
          echo "- 签名: Android 默认 debug 签名（定制版已放行自定义签名）" >> $GITHUB_STEP_SUMMARY
