android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.overridePathCheck=true

# 开源版签名配置示例（本地可选覆盖；不要提交真实密钥）
# OKK_STORE_FILE=../release-okk.keystore
# OKK_STORE_PASSWORD=your-password
# OKK_KEY_ALIAS=your-alias
# OKK_KEY_PASSWORD=your-password

# ── 定制版：签名校验放行开关 ──────────────────────────────────
# true  = 允许用你自己的证书签名后仍能注入（定制重编译必开）
# false = 仅官方证书可用
okk.allowCustomSignature=true
# 可选：把你的正式签名证书 SHA256 填这里做精确可信（留空则上面的开关放行任意签名）
okk.customSignSha256=
